[package]
name = "validity-rs"
version = "0.1.2"
edition = "2024"
description = "Native fingerprint authentication daemon for Validity sensors (138a:0097)"
license = "MIT"

[dependencies]
nusb = { version = "0.2.8", features = ["tokio"] }
tokio = { version = "1.42", features = ["full"] }
hex = "0.4.3"
byteorder = "1.5.0"
sha2 = "0.10.8"
hmac = "0.12.1"
aes = "0.8.4"
cbc = "0.1.2"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
getrandom = "0.2.17"
zbus = { version = "6.0.0", features = ["tokio"] }
futures-util = "0.3"
libc = "0.2"


